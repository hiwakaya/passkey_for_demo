[project]
name = "passkey-auth"
version = "0.1.0"
description = "FastAPI向けパスキー（FIDO2/WebAuthn）認証の再利用可能コンポーネント（GLAVIS 自治体AIデモ共通）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "pydantic>=2.7",
    "webauthn>=3.0,<4.0",  # v3系でVerifiedRegistration/VerifiedAuthenticationの配置が変わった
    "PyJWT>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["^tests/"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
passkey_auth = ["py.typed", "static/*.js"]
